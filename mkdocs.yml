site_name: DevOps & SRE Skill Bank
site_description: Notes, runbooks and hands-on skills in DevOps, SRE, Kubernetes and multi-cloud.
# Change mrsathis to your GitHub username (lowercase)
site_url: https://mrsathis.github.io/devops-skill-bank/
repo_url: https://github.com/mrsathis/devops-skill-bank
repo_name: devops-skill-bank
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/server-network
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - About me: about.md
  - Kubernetes:
      - kubernetes/index.md
      - kubectl troubleshooting: kubernetes/kubectl-troubleshooting.md
  - Cloud:
      - cloud/index.md
      - AWS: cloud/aws.md
      - Azure: cloud/azure.md
      - GCP: cloud/gcp.md
  - SRE:
      - sre/index.md
      - SLOs & error budgets: sre/slos-and-error-budgets.md
      - Incident response: sre/incident-response.md
      - Postmortem template: sre/postmortem-template.md
  - CI/CD:
