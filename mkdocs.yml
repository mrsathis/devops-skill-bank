          - HCLTech: interview-prep/companies/hcltech.md
          - Infosys: interview-prep/companies/infosys.md
          - J.P. Morgan: interview-prep/companies/jp-morgan.md
          - JioHotstar: interview-prep/companies/jiohotstar.md
          - LinkedIn: interview-prep/companies/linkedin.md
          - Meesho: interview-prep/companies/meesho.md
          - Mphasis: interview-prep/companies/mphasis.md
          - Netflix: interview-prep/companies/netflix.md
          - Nvidia: interview-prep/companies/nvidia.md
          - Paytm: interview-prep/companies/paytm.md
          - Siemens: interview-prep/companies/siemens.md
